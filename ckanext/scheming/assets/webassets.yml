scheming_css:
  output: ckanext-scheming/%(version)s_scheming_css.css
  contents:
    - styles/scheming.css

subfields:
  filters: rjsmin
  output: ckanext-scheming/%(version)s_scheming_subfields.js
  extra:
    preload:
      - base/main
  contents:
    - js/scheming-repeating-subfields.js

multiple_text:
  filters: rjsmin
  output: ckanext-scheming/%(version)s_scheming_multiple_text.js
  extra:
    preload:
      - base/main
  contents:
    - js/scheming-multiple-text.js

scheming_accordion_js:
  output: ckanext-scheming/%(version)s_scheming_accordion_js.js
  contents:
    - js/scheming_accordion.js
  extra:
    preload:
      - base/main

scheming_checkbox_js:
  output: ckanext-scheming/%(version)s_scheming_checkbox_js.js
  contents:
    - js/scheming_checkbox.js
  extra:
    preload:
      - base/main
